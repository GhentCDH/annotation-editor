packages:
  - 'packages/*'
  - 'packages/**'
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  es5-ext: true
  esbuild: true
  nx: true
  unrs-resolver: true
linkWorkspacePackages: true
dedupeInjectedDeps: false
onlyBuiltDependencies:
  - better-sqlite3
minimumReleaseAgeExclude:
  - '@ghentcdh/crouton-api@0.0.1-alpha.47 || 0.0.1-alpha.50'
  - '@ghentcdh/crouton-core@0.0.1-alpha.47 || 0.0.1-alpha.50'
  - '@ghentcdh/crouton-vue@0.0.1-alpha.47 || 0.0.1-alpha.50'
  - '@ghentcdh/create-crouton@0.0.1-alpha.47 || 0.0.1-alpha.50'

__overrides:
  '@ghentcdh/crouton-vue': link:../crouton/packages/crouton-vue
  '@ghentcdh/crouton-api': link:../crouton/packages/crouton-api
  '@ghentcdh/crouton-core': link:../crouton/packages/crouton-core
