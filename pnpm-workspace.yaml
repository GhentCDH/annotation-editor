packages:
  - 'packages/*'
  - 'packages/**'
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  es5-ext: true
  esbuild: true
  nx: true
  unrs-resolver: true
linkWorkspacePackages: true
dedupeInjectedDeps: false
onlyBuiltDependencies:
  - better-sqlite3
minimumReleaseAgeExclude:
  - '@ghentcdh/crouton-api@0.0.1-alpha.37'
  - '@ghentcdh/crouton-cli@0.0.1-alpha.37'
  - '@ghentcdh/crouton-core@0.0.1-alpha.37'
  - '@ghentcdh/crouton-forms-vue@0.0.1-alpha.37'
  - '@ghentcdh/crouton-vue@0.0.1-alpha.37'
