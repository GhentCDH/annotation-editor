name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  ci:
    # Shared with the other GhentCDH repos, maintained in crouton:
    # https://github.com/GhentCDH/crouton/blob/main/.github/workflows/shared-ci.yml
    uses: GhentCDH/crouton/.github/workflows/shared-ci.yml@main
    with:
      knip: true
