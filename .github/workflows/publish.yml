name: Publish

# Triggered by the tag that `pnpm release` (nx release --skip-publish) pushes.
# Keep this filename: npm trusted publishing is registered against publish.yml.
on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

jobs:
  npm:
    uses: GhentCDH/crouton/.github/workflows/shared-publish-npm.yml@main
    permissions:
      contents: read
      id-token: write

  release:
    needs: npm
    # Still cut the release when a package failed: the notes list what made it.
    if: ${{ !cancelled() }}
    uses: GhentCDH/crouton/.github/workflows/shared-github-release.yml@main
    with:
      extra-notes: ${{ needs.npm.outputs.summary }}
    permissions:
      contents: write
