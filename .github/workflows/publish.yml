name: Publish

# Triggered by the tag that `pnpm release` (nx release --skip-publish) pushes.
# Keep this filename: npm trusted publishing is registered against publish.yml.
on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

jobs:
  npm:
    uses: GhentCDH/crouton/.github/workflows/shared-publish-npm.yml@main
    with:
      # A prerelease tag never becomes `latest`: v0.1.0-rc.0 publishes under the
      # `rc` dist-tag, any other prerelease (v0.1.0-alpha.1) under `alpha`.
      # A plain version (v0.1.0) publishes as `latest`.
      publish-args: >-
        --access public --verbose
        ${{ contains(github.ref_name, '-rc.') && '--tag rc' || (contains(github.ref_name, '-') && '--tag alpha' || '') }}
    permissions:
      contents: read
      id-token: write

  release:
    needs: npm
    # Still cut the release when a package failed: the notes list what made it.
    if: ${{ !cancelled() }}
    uses: GhentCDH/crouton/.github/workflows/shared-github-release.yml@main
    with:
      extra-notes: ${{ needs.npm.outputs.summary }}
    permissions:
      contents: write
